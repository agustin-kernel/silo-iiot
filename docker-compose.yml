services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb_silo
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=mi_agro_industria
      - DOCKER_INFLUXDB_INIT_BUCKET=silo_data
      - DOCKER_INFLUXDB_INIT_TOKEN=${INFLUX_TOKEN}
    volumes:
      - /home/flia/silo-iiot/influxdb-data:/var/lib/influxdb2
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana_silo
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_silo
    ports:
      - "1883:1883"
    volumes:
      - ~/silo-iiot/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    container_name: telegraf_silo
    volumes:
      - ~/silo-iiot/telegraf/config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}

